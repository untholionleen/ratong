<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiVault | 学术英语词汇管理与打卡系统</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-slate-900 text-white p-2 rounded-lg">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-slate-900">LexiVault <span class="text-xs px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full font-normal">学术版</span></h1>
                </div>
            </div>
            <nav class="flex items-center space-x-2">
                <button onclick="switchTab('study')" id="nav-study" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-900 text-white transition-all flex items-center gap-2">
                    <i data-lucide="layers" class="w-4 h-4"></i> 背诵打卡
                </button>
                <button onclick="switchTab('manager')" id="nav-manager" class="px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition-all flex items-center gap-2">
                    <i data-lucide="database" class="w-4 h-4"></i> 词书云端管理
                </button>
            </nav>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">

        <!-- 1. 背诵打卡视图 -->
        <section id="view-study" class="space-y-6">
            <!-- 筛选控制栏 -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-4 items-center justify-between">
                <div class="flex flex-wrap items-center gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">选择等级</label>
                        <select id="filter-level" onchange="loadBooksByLevel()" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-slate-900">
                            <option value="">全部等级</option>
                            <option value="CET4">CET-4 (四级)</option>
                            <option value="CET6">CET-6 (六级)</option>
                            <option value="IELTS">IELTS (雅思)</option>
                            <option value="GRE">GRE (GRE)</option>
                            <option value="OTHER">Other (其他)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">选择词书</label>
                        <select id="filter-book" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-slate-900 min-w-[200px]">
                            <option value="">请先选择等级或加载词书</option>
                        </select>
                    </div>
                </div>
                <button onclick="startSession()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm shadow-sm transition-all flex items-center gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i> 开始今日打卡
                </button>
            </div>

            <!-- 卡片背诵工作区 -->
            <div id="study-workspace" class="hidden max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-8 space-y-6">
                <div class="flex justify-between items-center text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    <span id="study-progress-text">进度: 0 / 0</span>
                    <span id="study-book-badge" class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-md"></span>
                </div>

                <!-- 单词展示主体 -->
                <div class="text-center space-y-3 py-6 border-y border-slate-100">
                    <h2 id="card-word" class="text-4xl font-bold tracking-tight text-slate-900 font-mono">--</h2>
                    <div class="flex justify-center items-center gap-4 text-sm text-slate-500 font-mono">
                        <span>US: <span id="card-phonetic-us">--</span></span>
                        <span>UK: <span id="card-phonetic-uk">--</span></span>
                    </div>
                </div>

                <!-- 释义与例句（默认隐藏或点击翻开） -->
                <div id="card-details" class="space-y-4 hidden transition-all">
                    <div>
                        <span id="card-pos" class="text-xs font-bold px-2 py-0.5 bg-slate-900 text-white rounded mr-2">--</span>
                        <span id="card-meaning" class="text-lg font-medium text-slate-800">--</span>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm text-slate-600 italic">
                        <p id="card-example">--</p>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="pt-4 flex items-center justify-center gap-4">
                    <button id="btn-reveal" onclick="revealCard()" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl shadow transition-all">
                        显示释义 (Space)
                    </button>
                    <div id="action-buttons" class="hidden w-full flex gap-3">
                        <button onclick="nextCard('hard')" class="flex-1 py-3 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 font-medium rounded-xl transition-all">
                            模糊 / 生疏
                        </button>
                        <button onclick="nextCard('mastered')" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl shadow transition-all">
                            掌握 / 熟练
                        </button>
                    </div>
                </div>
            </div>

            <!-- 空状态引导 -->
            <div id="study-empty" class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <i data-lucide="book-open-check" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                <h3 class="text-lg font-medium text-slate-700">准备开始您的学术词汇积累</h3>
                <p class="text-sm text-slate-400 mt-1">请在上栏选择对应的词书并点击“开始今日打卡”</p>
            </div>
        </section>

        <!-- 2. 词书云端管理与Excel导入视图 -->
        <section id="view-manager" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 导入面板 -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4 md:col-span-1">
                    <h3 class="font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="upload-cloud" class="w-5 h-5 text-blue-600"></i> 上传 Excel 词书
                    </h3>
                    <p class="text-xs text-slate-500 leading-relaxed">
                        请确保 Excel 第一行为标准英文字母表头（含 <code class="text-blue-600">*word, *part_of_speech, *meaning, *level, *book_name</code> 等）。一个 Excel 即代表一本独立词书。
                    </p>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">选择 Excel 文件</label>
                            <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
                        </div>
                        <button onclick="handleExcelUpload()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-lg text-sm shadow transition-all flex items-center justify-center gap-2">
                            <i data-lucide="arrow-up-circle" class="w-4 h-4"></i> 解析并同步到云端
                        </button>
                    </div>
                </div>

                <!-- 现有云端词书列表 -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4 md:col-span-2">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="server" class="w-5 h-5 text-blue-600"></i> 云端词书库管理
                        </h3>
                        <button onclick="loadCloudBooks()" class="text-xs text-blue-600 hover:underline flex items-center gap-1">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 刷新列表
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-400 uppercase text-xs border-b border-slate-200">
                                <tr>
                                    <th class="p-3">词书名称</th>
                                    <th class="p-3">考试等级</th>
                                    <th class="p-3">词条数量</th>
                                    <th class="p-3 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="cloud-books-tbody" class="divide-y divide-slate-100">
                                <tr>
                                    <td colspan="4" class="p-6 text-center text-slate-400">正在加载云端数据...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript 核心逻辑 -->
    <script>
        // 初始化 Supabase 客户端
        const SUPABASE_URL = "https://zqrhfcsrexoamizkzzhq.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxcmhmY3NyZXhvYW1pemt6emhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MjY3MDUsImV4cCI6MjEwNjAwMjcwNX0.Hw3mBAy3mJvPa7SeVOdfArq-fc8G6sff77SfWqWeZ_M";
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentSessionWords = [];
        let currentIndex = 0;
        let cloudBooksList = [];

        // 初始化 Lucide 图标
        lucide.createIcons();

        // 标签页切换
        function switchTab(tabName) {
            document.getElementById('view-study').classList.add('hidden');
            document.getElementById('view-manager').classList.add('hidden');
            document.getElementById('nav-study').className = "px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition-all flex items-center gap-2";
            document.getElementById('nav-manager').className = "px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition-all flex items-center gap-2";

            if (tabName === 'study') {
                document.getElementById('view-study').classList.remove('hidden');
                document.getElementById('nav-study').className = "px-4 py-2 text-sm font-medium rounded-lg bg-slate-900 text-white transition-all flex items-center gap-2";
                loadCloudBooksForFilter();
            } else {
                document.getElementById('view-manager').classList.remove('hidden');
                document.getElementById('nav-manager').className = "px-4 py-2 text-sm font-medium rounded-lg bg-slate-900 text-white transition-all flex items-center gap-2";
                loadCloudBooks();
            }
        }

        // 加载云端词书到筛选下拉框
        async function loadCloudBooksForFilter() {
            const level = document.getElementById('filter-level').value;
            let query = _supabase.from('vocabulary_words').select('book_name, level');
            if (level) query = query.eq('level', level);

            const { data, error } = await query;
            if (error) { console.error(error); return; }

            // 去重词书
            const uniqueBooks = Array.from(new Set(data.map(item => item.book_name)))
                .map(name => {
                    return data.find(item => item.book_name === name);
                });

            const bookSelect = document.getElementById('filter-book');
            bookSelect.innerHTML = '<option value="">请选择词书</option>';
            uniqueBooks.forEach(b => {
                bookSelect.innerHTML += `<option value="${b.book_name}">[${b.level}] ${b.book_name}</option>`;
            });
        }

        function loadBooksByLevel() {
            loadCloudBooksForFilter();
        }

        // 开始背诵打卡
        async function startSession() {
            const bookName = document.getElementById('filter-book').value;
            if (!bookName) {
                alert('请先选择一本具体的词书！');
                return;
            }

            const { data, error } = await _supabase
                .from('vocabulary_words')
                .select('*')
                .eq('book_name', bookName);

            if (error || !data || data.length === 0) {
                alert('该词书暂无单词数据或加载失败！');
                return;
            }

            currentSessionWords = data;
            currentIndex = 0;

            document.getElementById('study-empty').classList.add('hidden');
            document.getElementById('study-workspace').classList.remove('hidden');
            document.getElementById('study-book-badge').innerText = bookName;
            renderCard();
        }

        // 渲染当前单词卡片
        function renderCard() {
            if (currentIndex >= currentSessionWords.length) {
                alert('恭喜您！已完成该词书本轮全部单词打卡！');
                document.getElementById('study-workspace').classList.add('hidden');
                document.getElementById('study-empty').classList.remove('hidden');
                return;
            }

            const wordObj = currentSessionWords[currentIndex];
            document.getElementById('study-progress-text').innerText = `进度: ${currentIndex + 1} / ${currentSessionWords.length}`;
            document.getElementById('card-word').innerText = wordObj.word;
            document.getElementById('card-phonetic-us').innerText = wordObj.phonetic_us || '--';
            document.getElementById('card-phonetic-uk').innerText = wordObj.phonetic_uk || '--';
            
            document.getElementById('card-pos').innerText = wordObj.part_of_speech;
            document.getElementById('card-meaning').innerText = wordObj.meaning;
            document.getElementById('card-example').innerText = wordObj.example || '暂无例句';

            // 重置翻开状态
            document.getElementById('card-details').classList.add('hidden');
            document.getElementById('btn-reveal').classList.remove('hidden');
            document.getElementById('action-buttons').classList.add('hidden');
        }

        // 翻开卡片
        function revealCard() {
            document.getElementById('card-details').classList.remove('hidden');
            document.getElementById('btn-reveal').classList.add('hidden');
            document.getElementById('action-buttons').classList.remove('hidden');
        }

        // 下一个单词
        async function nextCard(status) {
            const wordObj = currentSessionWords[currentIndex];
            // 异步记录打卡状态到云端
            await _supabase.from('user_study_progress').insert({
                word_id: wordObj.id,
                status: status
            });

            currentIndex++;
            renderCard();
        }

        // Excel 导入逻辑
        async function handleExcelUpload() {
            const fileInput = document.getElementById('excel-file-input');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('请先选择一个 Excel 文件！');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                    if (jsonRows.length === 0) {
                        alert('Excel 文件内容为空！');
                        return;
                    }

                    // 验证必要表头
                    const sample = jsonRows[0];
                    if (!sample.word || !sample.meaning || !sample.part_of_speech || !sample.level || !sample.book_name) {
                        alert('Excel 表头不符合规范！请确保包含 *word, *part_of_speech, *meaning, *level, *book_name 字段。');
                        return;
                    }

                    // 批量插入云端 Supabase
                    const formattedRows = jsonRows.map(row => ({
                        word: String(row.word || '').trim(),
                        phonetic_us: String(row.phonetic_us || ''),
                        phonetic_uk: String(row.phonetic_uk || ''),
                        part_of_speech: String(row.part_of_speech || '').trim(),
                        meaning: String(row.meaning || '').trim(),
                        example: String(row.example || ''),
                        level: String(row.level || 'CET4').trim(),
                        book_name: String(row.book_name || '默认词书').trim()
                    }));

                    const { error } = await _supabase.from('vocabulary_words').insert(formattedRows);
                    if (error) {
                        throw error;
                    }

                    alert(`成功导入 ${formattedRows.length} 条词汇到云端！`);
                    fileInput.value = '';
                    loadCloudBooks();
                } catch (err) {
                    console.error(err);
                    alert('导入失败，请检查 Excel 格式或网络连接：' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 加载云端词书库列表
        async function loadCloudBooks() {
            const tbody = document.getElementById('cloud-books-tbody');
            tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">正在查询云端...</td></tr>`;

            const { data, error } = await _supabase.from('vocabulary_words').select('book_name, level, id');
            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-500">加载失败: ${error.message}</td></tr>`;
                return;
            }

            // 聚合统计
            const bookMap = {};
            data.forEach(item => {
                if (!bookMap[item.book_name]) {
                    bookMap[item.book_name] = { level: item.level, count: 0 };
                }
                bookMap[item.book_name].count++;
            });

            const books = Object.keys(bookMap);
            if (books.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">云端暂无词书，请在左侧上传 Excel。</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            books.forEach(bookName => {
                const info = bookMap[bookName];
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-all">
                        <td class="p-3 font-medium text-slate-900">${bookName}</td>
                        <td class="p-3"><span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded text-xs font-mono">${info.level}</span></td>
                        <td class="p-3 text-slate-600 font-mono">${info.count} 词</td>
                        <td class="p-3 text-right">
                            <button onclick="deleteBook('${bookName}')" class="text-rose-600 hover:text-rose-800 text-xs font-medium px-2 py-1 bg-rose-50 rounded hover:bg-rose-100 transition-all">删除整本</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 删除整本词书
        async function deleteBook(bookName) {
            if (!confirm(`确定要从云端彻底删除词书《${bookName}》及其所有单词吗？`)) return;

            const { error } = await _supabase.from('vocabulary_words').delete().eq('book_name', bookName);
            if (error) {
                alert('删除失败: ' + error.message);
                return;
            }
            alert('词书已成功删除！');
            loadCloudBooks();
        }

        // 初始预加载云端词书状态
        loadCloudBooksForFilter();
    </script>
</body>
</html>
